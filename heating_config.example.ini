# Settings for Moby's Heat.
# Copy this file to heating_config.ini and fill it in.
# Keep heating_config.ini private: it holds your ESi password in plain text.

[esi]
# The login you use for the ESi Centro app
email =
password =

[dashboard]
# Numbers only. Leave blank for no PIN. Needs at least 6 numbers if you use
# a web address under [cloudflare].
pin =

# yes = reachable from other devices on your home network, no = this computer only
share = no

port = 8080

[location]
# A UK postcode, used for the outside temperature and forecast
postcode =

[cloudflare]
# Optional: your own web address through a Cloudflare tunnel, e.g. heat.example.co.uk
# Set the tunnel up first (see the README). Leave hostname blank to stay at home only.
hostname =
tunnel = heating-dashboard

[ai]
# Smart heating asks the AIs in this order, then falls back to plain rules.
# Leave both keys blank to use the rules only.
order = gemini, claude
gemini_api_key =
gemini_model = gemini-3.5-flash-lite
claude_api_key =
claude_model = claude-haiku-5-5
max_calls_per_day = 40
